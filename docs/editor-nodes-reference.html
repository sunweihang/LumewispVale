<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>节点图编辑器 · 节点参考手册</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1c1f26;
    --panel2: #242831;
    --ink: #e8eaed;
    --muted: #9aa3b2;
    --line: #323845;
    --accent: #5b9fd4;
    --skill: #598cc9;
    --ballistic: #2980b9;
    --buff: #c0392b;
    --warn: #e8b84a;
    --ok: #3dba7a;
    --radius: 10px;
    --font: "IBM Plex Sans", "Source Han Sans SC", "Noto Sans SC", "PingFang SC", sans-serif;
    --mono: "IBM Plex Mono", Menlo, Consolas, monospace;
    --sidebar-w: 280px;
    --page-w: 1180px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    color: var(--ink);
    background: var(--bg);
    line-height: 1.5;
  }
  button, input { font: inherit; color: inherit; }
  a { color: var(--accent); }
  code, .mono { font-family: var(--mono); }

  .app {
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100%;
    justify-items: center;
  }

  /* ——— Top ——— */
  .top {
    width: 100%;
    background: #101218;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: center;
  }
  .top-inner {
    width: 100%;
    max-width: var(--page-w);
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    justify-content: center;
    padding: 10px 20px;
  }
  .brand { font-weight: 700; font-size: 15px; }
  .brand small { color: var(--muted); font-weight: 500; margin-left: 8px; }
  .modes { display: flex; gap: 4px; background: var(--panel); padding: 3px; border-radius: 8px; border: 1px solid var(--line); }
  .mode {
    border: 0; background: transparent; color: var(--muted);
    padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .mode.active { background: var(--panel2); color: #fff; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    border: 1px solid var(--line); background: var(--panel);
    border-radius: 999px; padding: 5px 11px; cursor: pointer; font-size: 12px; color: var(--muted);
  }
  .tab.active { color: #fff; border-color: transparent; }
  .tab[data-ed="skill"].active { background: var(--skill); }
  .tab[data-ed="ballistic"].active { background: var(--ballistic); }
  .tab[data-ed="buff"].active { background: var(--buff); }
  .tab[data-ed="all"].active { background: #3a4250; }
  #search {
    width: min(260px, 100%);
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 11px; font-size: 13px; outline: none;
  }
  #search:focus { border-color: var(--accent); }

  /* ——— Body ——— */
  .body {
    width: 100%;
    max-width: var(--page-w);
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    min-height: 0;
    min-width: 0;
  }
  .sidebar {
    border-right: 1px solid var(--line);
    background: var(--panel);
    display: flex; flex-direction: column; min-height: 0;
  }
  .side-head {
    padding: 10px 12px 6px;
    font-size: 11px; color: var(--muted); letter-spacing: .06em; text-transform: uppercase;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .side-head .side-tools { display: flex; gap: 4px; }
  .side-tool {
    border: 1px solid var(--line); background: var(--panel2); color: var(--muted);
    border-radius: 5px; padding: 2px 7px; font-size: 11px; cursor: pointer;
  }
  .side-tool:hover { color: #fff; }
  .tree {
    flex: 1; overflow: auto; padding: 4px 8px 12px;
  }
  .tree-group { margin-bottom: 2px; }
  .tree-cat {
    display: flex; align-items: center; gap: 8px;
    width: 100%; text-align: left;
    border: 0; background: transparent; color: var(--ink);
    padding: 8px 8px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 600;
  }
  .tree-cat.sub { font-size: 12px; font-weight: 600; padding: 6px 8px; color: #c5cad3; }
  .tree-cat:hover { background: rgba(255,255,255,.04); }
  .tree-cat .chev {
    width: 14px; flex: 0 0 auto;
    color: var(--muted); font-size: 10px;
    transition: transform .15s ease;
  }
  .tree-group.open > .tree-cat .chev { transform: rotate(90deg); }
  .tree-cat .count {
    margin-left: auto; font-size: 11px; font-weight: 500; color: var(--muted);
  }
  .tree-children {
    display: none;
    padding: 0 0 4px 6px;
    margin: 0 0 4px 10px;
    border-left: 1px solid var(--line);
  }
  .tree-group.open > .tree-children { display: block; }
  .node-item {
    display: flex; align-items: center; gap: 8px;
    width: 100%; text-align: left;
    border: 0; background: transparent; color: var(--ink);
    padding: 6px 8px; border-radius: 7px; cursor: pointer; font-size: 13px;
  }
  .node-item:hover { background: rgba(255,255,255,.04); }
  .node-item.active { background: rgba(91,159,212,.16); color: #fff; }
  .sw { width: 8px; height: 8px; border-radius: 2px; flex: 0 0 auto; }
  .node-item .t { flex: 1; min-width: 0; }
  .node-item .t b { display: block; font-weight: 600; font-size: 13px; }
  .node-item .t span { display: block; font-size: 10px; color: var(--muted); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .main { min-width: 0; min-height: 0; overflow: auto; width: 100%; }
  .view { display: none; padding: 24px 20px 56px; width: 100%; margin: 0 auto; }
  .view.active { display: block; }

  /* ——— Cookbook ——— */
  .hero { text-align: center; margin-bottom: 20px; }
  .hero h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: -.02em; }
  .hero p { margin: 0 auto; color: var(--muted); max-width: 52ch; font-size: 14px; }
  .example {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    margin: 0 auto 18px;
    max-width: 720px;
    overflow: hidden;
  }
  .example-h {
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--line);
  }
  .example-h .row {
    display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
    margin-bottom: 8px;
  }
  .example-h h3 { margin: 0; font-size: 18px; }
  .example-h .goal {
    margin: 0;
    font-size: 14px;
    color: #d7dbe3;
    line-height: 1.45;
  }
  .example-h .when {
    margin: 8px 0 0;
    font-size: 12px;
    color: var(--muted);
  }
  .example-h .when b { color: var(--warn); font-weight: 600; }
  .pill {
    font-size: 11px; font-weight: 600;
    padding: 2px 8px; border-radius: 999px; color: #fff;
  }
  .pill.skill { background: var(--skill); }
  .pill.ballistic { background: var(--ballistic); }
  .pill.buff { background: var(--buff); }
  .example-b { padding: 8px 12px 16px; }
  .step {
    display: grid;
    grid-template-columns: 36px 1fr;
    gap: 10px;
    padding: 12px 8px;
    border-bottom: 1px solid rgba(50,56,69,.7);
  }
  .step:last-child { border-bottom: 0; }
  .step-num {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--panel2); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: var(--accent);
    margin-top: 2px;
  }
  .step h4 { margin: 0 0 4px; font-size: 14px; }
  .step p { margin: 0 0 8px; font-size: 13px; color: var(--muted); line-height: 1.5; }
  .step-nodes { display: flex; flex-wrap: wrap; gap: 6px; }
  .step-node {
    font-size: 12px;
    padding: 3px 8px;
    border-radius: 6px;
    background: #2d2d2d;
    border: 1px solid #111;
    color: #eee;
  }
  .step-node i {
    display: inline-block; width: 7px; height: 7px; border-radius: 2px;
    margin-right: 5px; vertical-align: middle;
  }
  .path {
    font-size: 11px; color: var(--muted);
    font-family: var(--mono);
    padding: 0 20px 14px;
    text-align: left;
  }
  .pre {
    margin: 0;
    padding: 12px 14px;
    background: #12151b;
    border: 1px solid var(--line);
    border-radius: 8px;
    font-family: var(--mono);
    font-size: 12px;
    white-space: pre-wrap;
    color: #c9d1d9;
    line-height: 1.55;
  }

  /* ——— Detail ——— */
  .detail-empty {
    color: var(--muted); padding: 60px 20px; text-align: center;
  }
  .detail-card {
    max-width: 720px;
    margin: 0 auto;
  }
  .detail-hero {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .detail-hero-top {
    padding: 18px 20px 12px;
  }
  .detail-hero-top h2 {
    margin: 0 0 6px;
    font-size: 26px;
    letter-spacing: -.02em;
  }
  .detail-what {
    margin: 0;
    font-size: 15px;
    color: #e8eaed;
    line-height: 1.45;
  }
  .detail-meta {
    display: flex; flex-wrap: wrap; gap: 8px;
    margin-top: 12px;
  }
  .tag {
    font-size: 12px; padding: 3px 9px; border-radius: 999px;
    background: var(--panel2); border: 1px solid var(--line); color: var(--muted);
  }
  .preview-stage {
    background:
      linear-gradient(#1e1e1e 1px, transparent 1px) 0 0 / 20px 20px,
      linear-gradient(90deg, #1e1e1e 1px, transparent 1px) 0 0 / 20px 20px,
      #181818;
    padding: 24px 16px;
    display: flex; justify-content: center; align-items: center;
    border-top: 1px solid var(--line);
    min-height: 160px;
  }
  .preview-stage canvas { max-width: 100%; height: auto; display: block; }
  .detail-section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .detail-section h3 {
    margin: 0 0 10px;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: .04em;
  }
  .how-line {
    margin: 0 0 10px;
    font-size: 14px;
    color: #d7dbe3;
    line-height: 1.5;
  }
  .port-list { display: grid; gap: 8px; }
  .port-row {
    padding: 8px 10px;
    background: #161a21;
    border-radius: 8px;
    border: 1px solid rgba(50,56,69,.8);
  }
  .port-row b {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 14px;
  }
  .port-row p {
    margin: 4px 0 0;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.4;
  }
  .port-group-title {
    margin: 12px 0 6px;
    font-size: 12px;
    color: var(--muted);
  }
  .port-group-title:first-child { margin-top: 0; }
  .dot {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.35);
  }
  .param-list { display: grid; gap: 12px; }
  .field-ui {
    display: grid;
    gap: 6px;
  }
  .field-ui .field-label {
    font-size: 12px;
    color: var(--muted);
  }
  .field-input, .field-select {
    width: 100%;
    box-sizing: border-box;
    background: #12151b;
    border: 1px solid #4a5568;
    border-radius: 6px;
    color: #e8eaed;
    font: inherit;
    font-size: 13px;
    padding: 8px 10px;
    outline: none;
  }
  .field-select {
    appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, #9aa3b2 50%), linear-gradient(135deg, #9aa3b2 50%, transparent 50%);
    background-position: calc(100% - 14px) 55%, calc(100% - 9px) 55%;
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 28px;
  }
  .field-input:focus, .field-select:focus {
    border-color: var(--accent);
  }
  .field-radios {
    display: flex; gap: 14px; flex-wrap: wrap;
    padding: 6px 0;
  }
  .field-radios label {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; color: #d7dbe3; cursor: default;
  }
  .field-radios input {
    accent-color: var(--accent);
  }
  .tip-box {
    background: rgba(91,159,212,.08);
    border: 1px solid rgba(91,159,212,.28);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 13px;
    color: #c5d8ea;
    line-height: 1.5;
  }
  .tip-box b { color: #fff; }
  .type-foot {
    margin-top: 8px;
    font-family: var(--mono);
    font-size: 11px;
    color: #667;
    text-align: center;
  }

  .footer {
    margin-top: 28px; padding-top: 14px;
    border-top: 1px solid var(--line);
    color: var(--muted); font-size: 12px;
    text-align: center;
  }

  @media (max-width: 900px) {
    .body { grid-template-columns: 1fr; }
    .sidebar { display: none; }
    #search { width: 100%; }
    .top-inner { justify-content: center; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-inner">
      <div class="brand">节点参考手册</div>
      <div class="modes">
        <button class="mode active" data-mode="catalog">节点图鉴</button>
        <button class="mode" data-mode="cookbook">使用示例</button>
      </div>
      <div class="tabs" id="edTabs">
        <button class="tab active" data-ed="all">全部</button>
        <button class="tab" data-ed="skill">技能</button>
        <button class="tab" data-ed="ballistic">弹道</button>
        <button class="tab" data-ed="buff">Buff</button>
      </div>
      <input id="search" type="search" placeholder="搜索节点 / 端口 / typeName…" autocomplete="off" />
    </div>
  </header>

  <div class="body">
    <aside class="sidebar" id="sidebar">
      <div class="side-head">
        <span>节点目录 <span id="nodeCount"></span></span>
        <span class="side-tools">
          <button type="button" class="side-tool" id="btnExpandAll">全开</button>
          <button type="button" class="side-tool" id="btnCollapseAll">全收</button>
        </span>
      </div>
      <div class="tree" id="tree"></div>
    </aside>

    <main class="main">
      <!-- Catalog detail（默认） -->
      <section class="view active" id="view-catalog">
        <div id="detail" class="detail-empty">从左侧目录点开分类，再选一个节点查看预览与端口。</div>
        <div class="footer">预览样式对齐编辑器画布 · 源码 extensions/*-editor/src/nodes/</div>
      </section>

      <!-- Cookbook -->
      <section class="view" id="view-cookbook">
        <div class="hero">
          <h1>使用示例</h1>
          <p>每个例子先说「要做什么」，再按步骤告诉你从哪个出口接线、用哪些节点。</p>
        </div>
        <div id="cookbook"></div>
        <div class="footer">对应资产在 assets/resources/*-graphs/ · 可在编辑器中直接打开对照</div>
      </section>
    </main>
  </div>
</div>

<script>
/* ========== Port colors (match PortTypeRegistry + domain) ========== */
const PORT_COLORS = {
  GraphFlow: '#f2f2f2',
  float: '#33ff33',
  int: '#26d973',
  bool: '#ff8080',
  string: '#66ccff',
  any: '#ffffff',
  entity: '#e67e22',
  entityList: '#d35400',
  vec3: '#1abc9c',
  prefab: '#9b59b6',
  ballistic: '#2980b9',
};

const SLOT = [['HUD',0],['根节点',1],['受击点',2],['左手武器',3],['右手武器',4],['头盔',5],['头部',6],['左手腕',7],['右手腕',8],['脊柱',9],['骨盆',10],['左手',11],['右手',12],['根骨骼',13],['枪',14],['炮塔点',15],['枪口',16],['开火点',17],['等级牌',18],['枪口1',19],['枪口2',20],['前方',21],['主躯干',22]];
const STATES = [['无',0],['硬直',1],['死亡',2],['施法中',3],['无法移动',4],['无法转向',5],['无法攻击',6],['击飞',7],['自由施法',8]];
const F = (n,t)=>({name:n,portType:t});
const FLOW='GraphFlow';

/* ========== Node definitions ========== */
const NODES = [
  // skill builtins
  n('skill','FloatConst','浮点常量','数学','#2e8b57',[F('前序',FLOW)],[F('后继',FLOW),F('值','float')],[{key:'value',label:'值',type:'number',default:0}]),
  n('skill','Add','相加','数学','#2e8b57',[F('前序',FLOW),F('A','float'),F('B','float')],[F('后继',FLOW),F('结果','float')]),
  n('skill','Vec3Negate','向量取反','数学','#2e8b57',[F('前序',FLOW),F('向量','vec3')],[F('后继',FLOW),F('结果','vec3')],null,'技能独有；回旋镖反向发射常用'),
  n('skill','Branch','分支','逻辑','#c44',[F('前序',FLOW),F('条件','bool')],[F('真',FLOW),F('假',FLOW)]),
  n('skill','BoolConst','布尔常量','逻辑','#c44',[F('前序',FLOW)],[F('后继',FLOW),F('值','bool')],[{key:'value',label:'值',type:'bool',default:true}]),
  n('skill','DebugLog','调试日志','工具','#888',[F('前序',FLOW),F('消息','string')],[F('后继',FLOW)],[{key:'message',label:'消息',type:'string',default:'hello'}]),
  n('skill','StringConst','字符串常量','工具','#888',[F('前序',FLOW)],[F('后继',FLOW),F('值','string')],[{key:'value',label:'值',type:'string',default:''}]),
  // skill domain
  n('skill','AbilityEntranceBlueprint','技能入口','技能/入口','#598cc9',[],[
    F('技能安装',FLOW),F('技能激活',FLOW),F('技能取消激活',FLOW),F('预寻怪',FLOW),F('施法成功',FLOW),
    F('抬手阶段',FLOW),F('引导开始',FLOW),F('引导周期触发',FLOW),F('释放开始',FLOW),F('释放结束',FLOW),
    F('技能卸载',FLOW),F('施法者死亡',FLOW),F('技能被打断',FLOW),F('每帧更新',FLOW),F('配置刷新',FLOW),
  ],null,'图的唯一入口；生命周期出口顺序固定，勿改'),
  n('skill','AbilityCaster','施法者','技能/实体','#e67e22',[F('前序',FLOW)],[F('后继',FLOW),F('施法者','entity')]),
  n('skill','EntityPositionBlueprint','实体坐标','技能/实体','#1abc9c',[F('前序',FLOW),F('实体','entity')],[F('后继',FLOW),F('坐标','vec3')]),
  n('skill','EntityForwardBlueprint','实体朝向','技能/实体','#1abc9c',[F('前序',FLOW),F('实体','entity')],[F('后继',FLOW),F('朝向','vec3')]),
  n('skill','EntityBoneWorldPositionBlueprint','骨骼世界坐标','技能/实体','#1abc9c',[F('前序',FLOW),F('目标单位','entity')],[F('后继',FLOW),F('世界坐标','vec3')],[
    {key:'bone',label:'挂点',type:'enum',default:17,options:SLOT},
    {key:'localOffsetX',label:'局部偏移 X',type:'number',default:0},
    {key:'localOffsetY',label:'局部偏移 Y',type:'number',default:0},
    {key:'localOffsetZ',label:'局部偏移 Z',type:'number',default:0},
  ],'开火点出生坐标常用；世界坐标 = p + r * localOffset'),
  n('skill','FindTargetByCircleBlueprint','圆形寻怪','技能/寻怪','#e74c3c',[F('前序',FLOW),F('中心坐标','vec3'),F('半径','float'),F('寻怪数量','int')],[F('后继',FLOW),F('目标列表','entityList'),F('列表数量','int')]),
  n('skill','FindTargetBySectorBlueprint','扇形寻怪','技能/寻怪','#c0392b',[F('前序',FLOW),F('中心坐标','vec3'),F('半径','float'),F('寻怪数量','int'),F('开角(度)','float')],[F('后继',FLOW),F('目标列表','entityList'),F('列表数量','int')]),
  n('skill','ForeachTargetBlueprint','遍历目标','技能/寻怪','#d35400',[F('前序',FLOW),F('目标列表','entityList')],[F('循环体',FLOW),F('循环结束',FLOW),F('当前目标','entity')]),
  n('skill','CastTargetEntityBlueprint','设定施法目标','技能/寻怪','#e67e22',[F('前序',FLOW),F('目标','entity')],[F('后继',FLOW)]),
  n('skill','AbilityCurrentSkillTargetBlueprint','当前技能目标','技能/寻怪','#e67e22',[F('前序',FLOW)],[F('有目标',FLOW),F('无目标',FLOW),F('目标','entity')]),
  n('skill','PlayAnimationBlueprint','播放动画','技能/动画','#8e44ad',[F('前序',FLOW)],[F('后继',FLOW),F('打击点[0]',FLOW),F('打击点[1]',FLOW),F('打击点[2]',FLOW)],[

/* ========== Node preview canvas (editor-like) ========== */
const HEADER_H=28, PORT_ROW_H=22, BODY_PAD=8, FIELD_CTRL_H=36, PORT_R=6;

function fieldShownValue(f){
  let v=f.default;
  if(f.type==='enum'&&f.options){
    const hit=f.options.find(o=>Array.isArray(o)?o[1]===v:o.value===v);
    return hit?(Array.isArray(hit)?hit[0]:hit.label):String(v);
  }
  if(f.type==='bool') return !!v;
  if(v===''||v===undefined||v===null) return '';
  return String(v);
}

function measure(node){
  const rows=Math.max(node.inputs.length,node.outputs.length,1);
  const fields=node.fields||[];
  const show=Math.min(fields.length,4);
  const fieldBlock=show?8+show*FIELD_CTRL_H+(fields.length>4?16:0):0;
  const h=Math.max(96, HEADER_H+BODY_PAD+rows*PORT_ROW_H+fieldBlock+12);
  const w=Math.max(220, node.minWidth||220, 40+Math.max(
    ...[...node.inputs,...node.outputs].map(p=>p.name.length*8+24), 140
  ));
  return {w:Math.min(w,340), h};
}

function drawPort(ctx,x,y,type,zoom){
  const r=PORT_R*zoom;
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
  if(type==='GraphFlow'){
    ctx.fillStyle='#1a1a1a'; ctx.fill();
    ctx.strokeStyle='#ddd'; ctx.lineWidth=1.5*zoom; ctx.stroke();
  } else {
    ctx.fillStyle=PORT_COLORS[type]||'#fff'; ctx.fill();
    ctx.strokeStyle='#111'; ctx.lineWidth=1*zoom; ctx.stroke();
  }
}

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}

function drawRadio(ctx,x,y,label,on,zoom){
  const r=5*zoom;
  ctx.beginPath(); ctx.arc(x+r, y+r, r, 0, Math.PI*2);
  ctx.fillStyle='#1a1a1a'; ctx.fill();
  ctx.strokeStyle='#888'; ctx.lineWidth=1*zoom; ctx.stroke();
  if(on){
    ctx.beginPath(); ctx.arc(x+r, y+r, r*0.45, 0, Math.PI*2);
    ctx.fillStyle='#5b9fd4'; ctx.fill();
  }
  ctx.fillStyle='#ddd';
  ctx.font=`${11*zoom}px sans-serif`;
  ctx.textAlign='left';
  ctx.textBaseline='middle';
  ctx.fillText(label, x+r*2+5*zoom, y+r);
}

function drawFieldControl(ctx, f, x, y, boxW, zoom){
  ctx.fillStyle='#9ad';
  ctx.font=`${10*zoom}px sans-serif`;
  ctx.textAlign='left';
  ctx.textBaseline='top';
  const label=f.label.length>16?f.label.slice(0,15)+'…':f.label;
  ctx.fillText(label, x, y);

  const boxY=y+12*zoom;
  const boxH=20*zoom;
  const val=fieldShownValue(f);

  if(f.type==='bool'){
    drawRadio(ctx, x, boxY+2*zoom, '是', val===true, zoom);
    drawRadio(ctx, x+48*zoom, boxY+2*zoom, '否', val===false, zoom);
    return;
  }

  roundRect(ctx, x, boxY, boxW, boxH, 4*zoom);
  ctx.fillStyle='#1a1a1a'; ctx.fill();
  ctx.strokeStyle='#666'; ctx.lineWidth=1*zoom; ctx.stroke();

  ctx.fillStyle='#e8eaed';
  ctx.font=`${11*zoom}px sans-serif`;
  ctx.textBaseline='middle';
  ctx.textAlign='left';
  const text=val===''?'':String(val);
  const maxW=boxW-(f.type==='enum'?22:12)*zoom;
  ctx.fillText(text.length>18?text.slice(0,17)+'…':text, x+8*zoom, boxY+boxH/2, maxW);

  if(f.type==='enum'){
    // chevron
    const cx=x+boxW-10*zoom, cy=boxY+boxH/2;
    ctx.beginPath();
    ctx.moveTo(cx-4*zoom, cy-2*zoom);
    ctx.lineTo(cx, cy+3*zoom);
    ctx.lineTo(cx+4*zoom, cy-2*zoom);
    ctx.strokeStyle='#9aa3b2'; ctx.lineWidth=1.2*zoom; ctx.stroke();
  }
}

function drawNodeToCanvas(canvas, node, scale=1.35){
  const {w,h}=measure(node);
  const zoom=scale;
  canvas.width=Math.ceil((w+24)*zoom);
  canvas.height=Math.ceil((h+24)*zoom);
  const ctx=canvas.getContext('2d');
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const ox=12*zoom, oy=12*zoom;
  const zw=w*zoom, zh=h*zoom, r=6*zoom;

  roundRect(ctx,ox,oy,zw,zh,r);
  ctx.fillStyle='#2d2d2d'; ctx.fill();
  ctx.strokeStyle='#111'; ctx.lineWidth=1*zoom; ctx.stroke();

  ctx.save();
  roundRect(ctx,ox,oy,zw,HEADER_H*zoom,r); ctx.clip();
  ctx.fillStyle=node.color||'#555'; ctx.fillRect(ox,oy,zw,HEADER_H*zoom+r);
  ctx.restore();
  ctx.fillStyle=node.color||'#555';
  ctx.fillRect(ox, oy+(HEADER_H-4)*zoom, zw, 4*zoom);

  ctx.fillStyle='#fff';
  ctx.font=`600 ${12*zoom}px sans-serif`;
  ctx.textBaseline='middle';
  ctx.textAlign='left';
  ctx.fillText(node.title, ox+10*zoom, oy+(HEADER_H*0.5)*zoom, zw-20*zoom);

  ctx.font=`${11*zoom}px sans-serif`;
  for(let i=0;i<node.inputs.length;i++){
    const y=oy+(HEADER_H+BODY_PAD+i*PORT_ROW_H+PORT_ROW_H*0.5)*zoom;
    const x=ox;
    drawPort(ctx,x,y,node.inputs[i].portType,zoom);
    ctx.fillStyle='#ddd'; ctx.textAlign='left';
    ctx.fillText(node.inputs[i].name, x+10*zoom, y);
  }
  for(let i=0;i<node.outputs.length;i++){
    const y=oy+(HEADER_H+BODY_PAD+i*PORT_ROW_H+PORT_ROW_H*0.5)*zoom;
    const x=ox+zw;
    drawPort(ctx,x,y,node.outputs[i].portType,zoom);
    ctx.fillStyle='#ddd'; ctx.textAlign='right';
    ctx.fillText(node.outputs[i].name, x-10*zoom, y);
  }

  const fields=node.fields||[];
  if(fields.length){
    const portRows=Math.max(node.inputs.length,node.outputs.length,1);
    let fy=oy+(HEADER_H+BODY_PAD+portRows*PORT_ROW_H+8)*zoom;
    const boxW=zw-20*zoom;
    fields.slice(0,4).forEach(f=>{
      drawFieldControl(ctx, f, ox+10*zoom, fy, boxW, zoom);
      fy+=FIELD_CTRL_H*zoom;
    });
    if(fields.length>4){
      ctx.fillStyle='#778';
      ctx.font=`${10*zoom}px sans-serif`;
      ctx.textAlign='left';
      ctx.textBaseline='top';
      ctx.fillText(`另有 ${fields.length-4} 个参数…`, ox+10*zoom, fy);
    }
  }
}

/* ========== Cookbook render ========== */
function renderCookbook(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const list=EXAMPLES.filter(ex=>{
    if(editorFilter!=='all'&&ex.ed!==editorFilter) return false;
    if(!q) return true;
    const hay=[ex.title,ex.goal,ex.when,ex.id,...ex.steps.flatMap(s=>[s.title,s.detail,...s.nodes])].join(' ').toLowerCase();
    return hay.includes(q);
  });
  const edName=ed=>ed==='skill'?'技能':ed==='ballistic'?'弹道':'Buff';
  document.getElementById('cookbook').innerHTML=list.map(ex=>`
    <article class="example">
      <div class="example-h">
        <div class="row">
          <h3>${esc(ex.title)}</h3>
          <span class="pill ${ex.ed}">${edName(ex.ed)} · ${esc(ex.id)}</span>
        </div>
        <p class="goal">${esc(ex.goal)}</p>
        <p class="when"><b>从哪接线：</b>${esc(ex.when)}</p>
      </div>
      <div class="example-b">
        ${ex.steps.map((s,i)=>`
          <div class="step">
            <div class="step-num">${i+1}</div>
            <div>
              <h4>${esc(s.title)}</h4>
              <p>${esc(s.detail)}</p>
              <div class="step-nodes">${s.nodes.map(name=>`<span class="step-node"><i style="background:${NODE_COLOR[name]||'#888'}"></i>${esc(name)}</span>`).join('')}</div>
            </div>
          </div>`).join('')}
      </div>
      <div class="path">资产：${esc(ex.path)}</div>
    </article>`).join('') || `<p class="detail-empty">没有匹配的示例</p>`;
}

/* ========== Sidebar + detail ========== */
function nodeMatches(n, q){
  if(editorFilter!=='all'&&n.editor!==editorFilter) return false;
  if(!q) return true;
  const hay=[n.title,n.typeName,n.category,n.note,
    ...n.inputs.map(p=>p.name),...n.outputs.map(p=>p.name),
    ...n.fields.map(f=>f.key+' '+f.label)].join(' ').toLowerCase();
  return hay.includes(q);
}

/** 按「父/子」建树：技能/入口 → 父「技能」+ 子「入口」 */
function buildTree(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  /** @type {Map<string, {key:string,label:string,color:string,nodes:any[],children:Map<string,any>}>} */
  const roots=new Map();

  function ensureRoot(label){
    if(!roots.has(label)){
      roots.set(label,{
        key:label, label,
        color:ROOT_COLORS[label]||null,
        nodes:[], children:new Map(),
      });
    }
    return roots.get(label);
  }

  NODES.forEach(n=>{
    if(!nodeMatches(n,q)) return;
    const parts=normalizeCategory(n.category).split('/');
    const [parent, ...rest]=parts;
    if(rest.length===0){
      const root=ensureRoot(parent);
      if(!root.color) root.color=n.color;
      root.nodes.push(n);
    } else {
      const childLabel=rest.join('/');
      const root=ensureRoot(parent);
      if(!root.color) root.color=ROOT_COLORS[parent]||n.color;
      const childKey=parts.join('/');
      if(!root.children.has(childKey)){
        root.children.set(childKey,{
          key:childKey, label:childLabel,
          color:n.color, nodes:[], children:[],
        });
      }
      const child=root.children.get(childKey);
      if(!child.color) child.color=n.color;
      child.nodes.push(n);
    }
  });

  return [...roots.values()].map(r=>({
    key:r.key,
    label:r.label,
    color:r.color,
    nodes:r.nodes,
    children:[...r.children.values()],
  })).sort((a,b)=>{
    const ia=ROOT_ORDER.indexOf(a.key), ib=ROOT_ORDER.indexOf(b.key);
    const aa=ia<0?999:ia, bb=ib<0?999:ib;
    if(aa!==bb) return aa-bb;
    return a.label.localeCompare(b.label,'zh');
  });
}

function childList(group){
  if(!group || !group.children) return [];
  return Array.isArray(group.children) ? group.children : [...group.children.values()];
}

function countNodes(group){
  return group.nodes.length + childList(group).reduce((s,c)=>s+countNodes(c),0);
}

function collectKeys(groups, out=[]){
  groups.forEach(g=>{
    out.push(g.key);
    collectKeys(childList(g),out);
  });
  return out;
}

function expandForSearch(groups){
  const q=document.getElementById('search').value.trim();
  if(!q) return;
  collectKeys(groups).forEach(k=>openCats.add(k));
}

function openPathForCategory(category){
  const cat=normalizeCategory(category);
  openCats.add(cat);
  const i=cat.indexOf('/');
  if(i>0) openCats.add(cat.slice(0,i));
}

function edBadge(ed){
  if(editorFilter!=='all') return '';
  const label=ed==='skill'?'技能':ed==='ballistic'?'弹道':'Buff';
  return `<i style="font-style:normal;font-size:10px;color:var(--muted);margin-left:4px">${label}</i>`;
}

function nodeButtons(nodes){
  return nodes.map(n=>`
    <button type="button" class="node-item ${selectedId===n.id?'active':''}" data-id="${esc(n.id)}">
      <span class="sw" style="background:${n.color}"></span>
      <span class="t"><b>${esc(n.title)}${edBadge(n.editor)}</b><span>${esc(n.typeName)}</span></span>
    </button>`).join('');
}

function renderGroup(group, depth){
  const open=openCats.has(group.key);
  const n=countNodes(group);
  const sub=depth>0?' sub':'';
  return `<div class="tree-group ${open?'open':''}" data-cat="${esc(group.key)}">
    <button type="button" class="tree-cat${sub}" data-cat="${esc(group.key)}">
      <span class="chev">▶</span>
      <span class="sw" style="background:${group.color||'#5b9fd4'}"></span>
      <span>${esc(group.label)}</span>
      <span class="count">${n}</span>
    </button>
    <div class="tree-children">
      ${nodeButtons(group.nodes)}
      ${childList(group).map(c=>renderGroup(c, depth+1)).join('')}
    </div>
  </div>`;
}

function renderSidebar(){
  const groups=buildTree();
  expandForSearch(groups);
  const total=groups.reduce((s,g)=>s+countNodes(g),0);
  document.getElementById('nodeCount').textContent=`(${total})`;

  document.getElementById('tree').innerHTML=groups.length
    ? groups.map(g=>renderGroup(g,0)).join('')
    : `<div class="detail-empty" style="padding:20px;font-size:12px">无匹配节点</div>`;

  document.querySelectorAll('#tree .tree-cat').forEach(b=>{
    b.onclick=()=>{
      const cat=b.getAttribute('data-cat');
      if(openCats.has(cat)) openCats.delete(cat); else openCats.add(cat);
      renderSidebar();
    };
  });
  document.querySelectorAll('#tree .node-item').forEach(b=>{
    b.onclick=()=>{
      selectedId=b.getAttribute('data-id');
      const node=NODES.find(n=>n.id===selectedId);
      if(node) openPathForCategory(node.category);
      setMode('catalog');
      renderSidebar();
      renderDetail();
    };
  });
}

function portDotStyle(portType){
  if(portType==='GraphFlow') return 'background:#1a1a1a;box-shadow:inset 0 0 0 1.5px #ddd';
  return `background:${PORT_COLORS[portType]||'#fff'}`;
}

function renderPorts(ports){
  if(!ports.length) return '';
  return `<div class="port-list">${ports.map(p=>{
    const {hint, kind}=portExplain(p);
    return `<div class="port-row">
      <b><span class="dot" style="${portDotStyle(p.portType)}"></span>${esc(p.name)}<span class="tag" style="margin-left:6px">${esc(kind)}</span></b>
      ${hint?`<p>${esc(hint)}</p>`:''}
    </div>`;
  }).join('')}</div>`;
}

function renderParams(fields){
  if(!fields.length) return `<div style="color:var(--muted);font-size:13px">这个节点没有可调字段，全靠接线。</div>`;
  return `<div class="param-list">${fields.map(f=>{
    if(f.type==='bool'){
      const on=!!f.default;
      return `<div class="field-ui">
        <div class="field-label">${esc(f.label)}</div>
        <div class="field-radios">
          <label><input type="radio" disabled ${on?'checked':''}/> 是</label>
          <label><input type="radio" disabled ${!on?'checked':''}/> 否</label>
        </div>
      </div>`;
    }
    if(f.type==='enum'&&f.options){
      const opts=f.options.map(o=>{
        const label=Array.isArray(o)?o[0]:o.label;
        const value=Array.isArray(o)?o[1]:o.value;
        const sel=value===f.default?' selected':'';
        return `<option${sel}>${esc(String(label))}</option>`;
      }).join('');
      return `<div class="field-ui">
        <div class="field-label">${esc(f.label)}</div>
        <select class="field-select" disabled>${opts}</select>
      </div>`;
    }
    const val=f.default===''||f.default===undefined||f.default===null?'':String(f.default);
    return `<div class="field-ui">
      <div class="field-label">${esc(f.label)}</div>
      <input class="field-input" type="text" value="${esc(val)}" readonly />
    </div>`;
  }).join('')}</div>`;
}

function renderDetail(){
  const el=document.getElementById('detail');
  const node=NODES.find(n=>n.id===selectedId);
  if(!node){
    el.className='detail-empty';
    el.textContent='从左侧目录点开分类，再选一个节点。';
    return;
  }
  const edLabel=node.editor==='skill'?'技能编辑器':node.editor==='ballistic'?'弹道编辑器':'Buff编辑器';
  const folder=normalizeCategory(node.category).replace('/',' / ');
  const {what, how, tip}=blurbFor(node);
  el.className='';
  el.innerHTML=`
    <div class="detail-card">
      <div class="detail-hero">
        <div class="detail-hero-top">
          <h2>${esc(node.title)}</h2>
          <p class="detail-what">${esc(what)}</p>
          <div class="detail-meta">
            <span class="pill ${node.editor}">${edLabel}</span>
            <span class="tag">${esc(folder)}</span>
          </div>
        </div>
        <div class="preview-stage"><canvas id="nodeCanvas"></canvas></div>
      </div>

      <div class="detail-section">
        <h3>怎么接</h3>
        <p class="how-line">${esc(how)}</p>
        ${node.inputs.length?`<div class="port-group-title">输入</div>${renderPorts(node.inputs)}`:''}
        ${node.outputs.length?`<div class="port-group-title">输出</div>${renderPorts(node.outputs)}`:''}
      </div>

      <div class="detail-section">
        <h3>可调参数</h3>
        ${renderParams(node.fields)}
      </div>

      ${tip?`<div class="tip-box" style="margin-bottom:12px"><b>补充：</b>${esc(tip)}</div>`:''}
      <div class="tip-box">
        <b>记一句：</b>白空心点是流程（谁先谁后），彩色实心点是数据（数字/单位/坐标）。同色才能相接。
      </div>
      <div class="type-foot">${esc(node.typeName)}</div>
    </div>`;
  const canvas=document.getElementById('nodeCanvas');
  if(canvas) drawNodeToCanvas(canvas, node, node.outputs.length>10?1.0:1.35);
}

function setMode(m){
  mode=m;
  document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.getAttribute('data-mode')===m));
  document.getElementById('view-cookbook').classList.toggle('active',m==='cookbook');
  document.getElementById('view-catalog').classList.toggle('active',m==='catalog');
  document.getElementById('sidebar').style.display=m==='catalog'?'flex':'none';
  const body=document.querySelector('.body');
  body.style.gridTemplateColumns=m==='catalog'?'var(--sidebar-w) 1fr':'1fr';
  body.style.justifyContent='center';
}

function refresh(){
  if(mode==='cookbook') renderCookbook();
  else { renderSidebar(); renderDetail(); }
}

document.querySelectorAll('.mode').forEach(b=>{
  b.onclick=()=>{setMode(b.getAttribute('data-mode')); refresh();};
});
document.querySelectorAll('#edTabs .tab').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('#edTabs .tab').forEach(t=>t.classList.remove('active'));
    b.classList.add('active');
    editorFilter=b.getAttribute('data-ed');
    openCats=new Set();
    refresh();
  };
});
document.getElementById('search').addEventListener('input',()=>{
  if(mode==='catalog'){renderSidebar();}
  else renderCookbook();
});
document.getElementById('btnExpandAll').onclick=()=>{
  collectKeys(buildTree()).forEach(k=>openCats.add(k));
  renderSidebar();
};
document.getElementById('btnCollapseAll').onclick=()=>{
  openCats=new Set();
  renderSidebar();
};

setMode('catalog');
refresh();
</script>
</body>
